name: Python FastAPI Currency ETL CI

# Пайплайн будет запускаться автоматически при каждом пуше в ветку main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем ваш код из репозитория на виртуальную машину GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем чистый Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Обновляем pip и ставим все пакеты из вашего requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # 4. Запускаем pytest (точно так же, как вы делали на компьютере)
    - name: Run automated tests
      run: |
        python -m pytest
